name: Sync Solodit Findings

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode. Backfill resumes from the BigQuery checkpoint."
        required: true
        default: "backfill"
        type: choice
        options:
          - incremental
          - backfill
      page_size:
        description: "Solodit API page size"
        required: true
        default: "50"
      max_pages:
        description: "Maximum pages for this run. Leave empty for mode default."
        required: false
        default: ""
      create_tables:
        description: "Create BigQuery dataset/tables before loading"
        required: true
        default: false
        type: boolean

concurrency:
  group: solodit-findings-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CYFRIN_API_KEY: ${{ secrets.CYFRIN_API_KEY }}
      BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
      BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
      BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION }}
      SOLODIT_BASE_URL: ${{ vars.SOLODIT_BASE_URL || 'https://solodit.cyfrin.io' }}
      SOLODIT_PAGE_SIZE: ${{ github.event.inputs.page_size || vars.SOLODIT_PAGE_SIZE || '50' }}
      SOLODIT_RATE_LIMIT_PER_MINUTE: ${{ vars.SOLODIT_RATE_LIMIT_PER_MINUTE || '20' }}
      SOLODIT_INCREMENTAL_MAX_PAGES: ${{ vars.SOLODIT_INCREMENTAL_MAX_PAGES || '10' }}
      SOLODIT_BACKFILL_MAX_PAGES: ${{ vars.SOLODIT_BACKFILL_MAX_PAGES || '50' }}
      SOLODIT_CHECKPOINT_BACKEND: ${{ vars.SOLODIT_CHECKPOINT_BACKEND || 'bigquery' }}
      SOLODIT_CHECKPOINT_STATE_NAME: ${{ vars.SOLODIT_CHECKPOINT_STATE_NAME || 'backfill' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Write Google credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GCP_SERVICE_ACCOUNT_JSON secret" >&2
            exit 1
          fi
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcp-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-service-account.json" >> "$GITHUB_ENV"

      - name: Validate required secrets
        run: |
          test -n "$CYFRIN_API_KEY" || { echo "Missing CYFRIN_API_KEY secret" >&2; exit 1; }
          test -n "$BIGQUERY_PROJECT_ID" || { echo "Missing BIGQUERY_PROJECT_ID secret" >&2; exit 1; }
          test -n "$BIGQUERY_DATASET" || { echo "Missing BIGQUERY_DATASET secret" >&2; exit 1; }
          test -n "$BIGQUERY_LOCATION" || { echo "Missing BIGQUERY_LOCATION secret" >&2; exit 1; }

      - name: Run tests
        run: python -m pytest

      - name: Sync findings
        env:
          SYNC_MODE: ${{ github.event.inputs.mode || 'backfill' }}
          MAX_PAGES_INPUT: ${{ github.event.inputs.max_pages }}
          CREATE_TABLES: ${{ github.event.inputs.create_tables || false }}
        run: |
          if [ -n "$MAX_PAGES_INPUT" ]; then
            MAX_PAGES="$MAX_PAGES_INPUT"
          elif [ "$SYNC_MODE" = "backfill" ]; then
            MAX_PAGES="$SOLODIT_BACKFILL_MAX_PAGES"
          else
            MAX_PAGES="$SOLODIT_INCREMENTAL_MAX_PAGES"
          fi

          args=(
            "scripts/sync.py"
            "$SYNC_MODE"
            "--page-size" "$SOLODIT_PAGE_SIZE"
            "--checkpoint-backend" "$SOLODIT_CHECKPOINT_BACKEND"
            "--checkpoint-state-name" "$SOLODIT_CHECKPOINT_STATE_NAME"
          )
          if [ -n "$MAX_PAGES" ]; then
            args+=("--max-pages" "$MAX_PAGES")
          fi
          if [ "$CREATE_TABLES" = "true" ]; then
            args+=("--create-tables")
          fi
          python "${args[@]}"

      - name: Print findings count
        if: always()
        run: |
          for file in data/findings_incremental.jsonl data/findings.jsonl; do
            if [ -f "$file" ]; then
              count=$(grep -cve '^[[:space:]]*$' "$file")
              echo "$file findings_count=$count"
            fi
          done
