name: Sync Code4rena Findings

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      max_contests:
        description: "Số lượng cuộc thi tối đa muốn cào lần này (để trống nếu muốn cào toàn bộ)"
        required: false
        default: ""
      severities:
        description: "Mức độ nghiêm trọng (all hoặc HIGH,MEDIUM,...)"
        required: false
        default: "all"
      reset:
        description: "Xóa checkpoint và cào lại từ đầu"
        required: false
        default: false
        type: boolean
      create_tables:
        description: "Tạo dataset và các bảng BigQuery nếu chưa tồn tại"
        required: true
        default: false
        type: boolean

concurrency:
  group: code4rena-findings-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BIGQUERY_PROJECT_ID: ${{ secrets.BIGQUERY_PROJECT_ID }}
      BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
      BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION || 'US' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Write Google credentials
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GCP_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing GCP_SERVICE_ACCOUNT_JSON secret" >&2
            exit 1
          fi
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gcp-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-service-account.json" >> "$GITHUB_ENV"

      - name: Validate required secrets
        run: |
          test -n "$BIGQUERY_PROJECT_ID" || { echo "Missing BIGQUERY_PROJECT_ID secret" >&2; exit 1; }
          test -n "$BIGQUERY_DATASET" || { echo "Missing BIGQUERY_DATASET secret" >&2; exit 1; }
          test -n "$BIGQUERY_LOCATION" || { echo "Missing BIGQUERY_LOCATION secret" >&2; exit 1; }

      - name: Restore Code4rena Checkpoint
        uses: actions/cache@v4
        with:
          path: data/checkpoints/code4rena_checkpoint.json
          key: code4rena-checkpoint-${{ github.run_id }}
          restore-keys: |
            code4rena-checkpoint-

      - name: Run tests
        run: python -m pytest

      - name: Sync Code4rena findings
        env:
          MAX_CONTESTS_INPUT: ${{ github.event.inputs.max_contests }}
          SEVERITIES_INPUT: ${{ github.event.inputs.severities || 'all' }}
          RESET_INPUT: ${{ github.event.inputs.reset || false }}
          CREATE_TABLES_INPUT: ${{ github.event.inputs.create_tables || false }}
        run: |
          args=(
            "scripts/crawl_code4rena.py"
            "--load-bigquery"
            "--severities" "$SEVERITIES_INPUT"
          )
          if [ -n "$MAX_CONTESTS_INPUT" ]; then
            args+=("--max-contests" "$MAX_CONTESTS_INPUT")
          fi
          if [ "$RESET_INPUT" = "true" ]; then
            args+=("--reset")
          fi
          if [ "$CREATE_TABLES_INPUT" = "true" ]; then
            args+=("--create-tables")
          fi
          python "${args[@]}"

      - name: Print findings count
        if: always()
        run: |
          if [ -f "data/findings_code4rena.jsonl" ]; then
            count=$(grep -cve '^[[:space:]]*$' "data/findings_code4rena.jsonl" || true)
            echo "data/findings_code4rena.jsonl findings_count=$count"
          fi
