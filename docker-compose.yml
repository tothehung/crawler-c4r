x-crawler-base: &crawler-base
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    CYFRIN_API_KEY: ${CYFRIN_API_KEY:-}
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://crawler:crawler@postgres:5432/w3goaudit_crawler}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    OUTPUT_DIR: ${OUTPUT_DIR:-/data/solodit}
    SOLODIT_BASE_URL: ${SOLODIT_BASE_URL:-https://solodit.cyfrin.io}
    SOLODIT_PAGE_SIZE: ${SOLODIT_PAGE_SIZE:-50}
    SOLODIT_RATE_LIMIT_PER_MINUTE: ${SOLODIT_RATE_LIMIT_PER_MINUTE:-20}
  volumes:
    - ../dataset/solodit:/data/solodit
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-w3goaudit_crawler}
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crawler}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  crawler-worker:
    <<: *crawler-base
    command:
      [
        "celery",
        "-A",
        "app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=crawl,export",
        "--concurrency=${CELERY_CONCURRENCY:-2}"
      ]

  crawler-beat:
    <<: *crawler-base
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=INFO"]
    profiles:
      - scheduler

  crawler-cli:
    <<: *crawler-base
    command: ["python", "-m", "app"]
    profiles:
      - cli
    restart: "no"

volumes:
  postgres-data:
  redis-data:
